# cad-boq-tool alembic 配置
# 2026-09-06 Web 化 Phase 0

[alembic]
# 迁移脚本目录
script_location = alembic

# 模板文件
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# 时间戳格式
timezone = Asia/Shanghai

# 升级/降级时输出
truncate_slug_length = 40

# 修订 ID 长度
revision_length = 12

# sqlalchemy.url：env.py 中重写（用 settings.database_url_sync）

# 日志
sourceless = false
version_path_separator = os
output_encoding = utf-8

[post_write_hooks]
# 暂无

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
