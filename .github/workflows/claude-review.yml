# Claude Code CI 评审（通用模板，与任何具体项目无关）
# 说明：评审下沉到 CI，不占本地会话上下文。
# 前置：仓库 Secret 需配置 ANTHROPIC_API_KEY。
#
# 两个易错点（改坏了会静默失效）：
#   1. claude_args 里的 --allowedTools 不能省 —— Action 只在此处列出时才启动
#      发 inline comment 的 MCP server；否则结果只写进 workflow 日志，PR 上看不到。
#   2. 若改用仓库内 Skill（prompt: "/skill-name"），必须保留 actions/checkout，
#      否则读不到 .claude/skills/。

name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: |
            --max-turns 5
            --allowedTools "mcp__github_inline_comment__create_inline_comment"

# ── 变体 A：用仓库内自定义 Skill ────────────────────────────────────────────
