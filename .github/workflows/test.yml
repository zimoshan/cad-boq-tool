name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: cadboq_test
          POSTGRES_USER: cadboq_test
          POSTGRES_PASSWORD: test
          TZ: Asia/Shanghai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cadboq_test -d cadboq_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AUTH_MODE: no_login
      DATABASE_URL: postgresql+asyncpg://cadboq_test:test@localhost:5432/cadboq_test
      DATABASE_URL_SYNC: postgresql+psycopg://cadboq_test:test@localhost:5432/cadboq_test
      SECRET_KEY: test-secret-key-for-ci
      LOG_DIR: /tmp/cad-boq-ci-logs
      DRAWING_CACHE_DIR: /tmp/cad-boq-ci-cache
      EMBEDDING_CACHE_DIR: /tmp/cad-boq-ci-cache
      BLOCK_GEOMETRY_DIR: /tmp/cad-boq-ci-cache
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .  # editable install so `webapi` module is importable by alembic env.py
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx pytest-cov

      - name: Enable PostGIS extension
        run: |
          PGPASSWORD=test psql -h localhost -U cadboq_test -d cadboq_test -c "CREATE EXTENSION IF NOT EXISTS postgis;"
          PGPASSWORD=test psql -h localhost -U cadboq_test -d cadboq_test -c 'CREATE EXTENSION IF NOT EXISTS "uuid-ossp";'

      - name: Run alembic migrations
        run: |
          alembic upgrade head

      - name: Run tests with coverage
        run: |
          pytest tests/ \
            --ignore=tests/test_canvas_lod.py \
            --ignore=tests/test_dwg_first.py \
            -v --tb=short \
            --cov=webapi --cov=app \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true
        continue-on-error: true

      - name: Verify FastAPI app starts
        run: |
          python -c "from webapi.main import app; print('FastAPI app loaded:', app.title, '| routes:', len(app.routes))"

  frontend-build:
    name: frontend (Node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install webui deps
        working-directory: webui
        run: npm ci

      - name: TypeScript typecheck
        working-directory: webui
        run: npm run typecheck

      - name: Build
        working-directory: webui
        run: npm run build

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: |
          # ruff 自动 fix（imports + 风格）+ format check
          # 当前遗留 B904 raise-from 53 个（实战业务代码不阻塞）；CI 不阻塞
          ruff check --fix webapi/ app/ || true
          ruff format --check webapi/ app/
