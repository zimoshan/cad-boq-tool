[project]
name = "cad-boq-tool"
version = "0.2.0.post1"  # PEP 440 兼容（post-release 表示 webify 重构后版本）
description = "CAD 工程量算量工具 - Web 化迁移 Phase 0（2026-09-06）"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [
    { name = "Mark Ma" }
]

# Web 化新增依赖（与 app/ 业务层并存，业务层依赖 PySide6 已删除）
dependencies = [
    # Web 框架
    "fastapi>=0.115.0,<0.116.0",
    "uvicorn[standard]>=0.30.0,<0.32.0",
    "python-multipart>=0.0.9",                # 文件上传

    # 数据 + ORM
    "sqlalchemy[asyncio]>=2.0.30,<2.1.0",   # 2.x async
    "asyncpg>=0.29.0",                        # PG async 驱动
    "psycopg[binary]>=3.1.0",                 # PG sync 驱动（alembic 迁移用）
    "alembic>=1.13.0",                        # 迁移工具
    "geoalchemy2>=0.15.0",                    # PostGIS SQLAlchemy 集成

    # 数据模型 + 配置
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.1",

    # 鉴权（Casbin + RuoYi 风格 RBAC）
    "casbin>=1.35.0",                         # RBAC 策略引擎
    "passlib[bcrypt]>=1.7.4",                 # 密码 hash
    "python-jose[cryptography]>=3.3.0",       # JWT（预留，当前免登录）

    # CAD 解析（业务层，保留）
    "ezdxf>=1.4.0,<2.0.0",
    "ezdwg>=0.5.0",                           # Rust 内核直读
    "shapely>=2.0.0",                         # 几何（Web GLOD 后续用）

    # Excel + LLM + 嵌入（业务层）
    "openpyxl>=3.1.0",
    "ollama>=0.3.0",
    "openai>=1.40.0",

    # 工具
    "pyarrow>=16.0.0",                        # B3 块几何外置 parquet
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",                          # FastAPI 测试客户端
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",                            # linter
    "mypy>=1.10.0",                           # 类型检查
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "webapi"]

# pytest 配置
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

# ruff 配置
[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM"]
ignore = ["E501"]  # 长行不强制（业务代码兼容）

# mypy 配置
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
